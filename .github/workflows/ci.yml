name: CI

# Tests run locally before pushing, not here: the backend suite (pytest, ~60 minutes), the
# frontend type-check/tests/build, and `diff CLAUDE.md AGENTS.md`. GitHub CI is only the
# dependency audit. Pull requests run security-audit.yml directly (it is the one required
# check on main); main pushes run it here, so the CI conclusion that gates release.yml is
# pip-audit's.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  security-audit:
    uses: ./.github/workflows/security-audit.yml
